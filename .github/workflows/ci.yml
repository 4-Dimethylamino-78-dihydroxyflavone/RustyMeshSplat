name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Real-COLMAP e2e coverage on Linux; the test self-skips where absent.
      - name: Install COLMAP (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y colmap

      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
